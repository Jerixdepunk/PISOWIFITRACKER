name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        id: locate
        run: |
          DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name "settings.gradle" -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          if [ -z "$DIR" ]; then
            DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name "settings.gradle.kts" -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)
          fi
          if [ -z "$DIR" ]; then
            echo "::error::No settings.gradle (or settings.gradle.kts) file was found anywhere in this repository. This means the Android project files were never actually pushed to GitHub — only re-check what files exist in the repo (Code tab), not just this workflow."
            exit 1
          fi
          echo "Found Gradle project at: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: piso-wifi-tracker-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
